<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Clicker 2.0 Clean Edition</title>
<style>
:root{
  --bg1:#8ec5fc;
  --bg2:#e0c3fc;
  --card:rgba(255,255,255,0.92);
  --shadow:0 6px 18px rgba(0,0,0,0.15);
  --green:#43a047;
  --green2:#2e7d32;
  --text:#1f2937;
  --muted:#5b6472;
  --line:#e5e7eb;
  --accent:#4caf50;
  --warn:#ffb703;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  color:var(--text);
}

.container{max-width:1080px;margin:auto;padding:12px}
.card{
  background:var(--card);
  border-radius:18px;
  padding:14px;
  box-shadow:var(--shadow);
  margin-bottom:10px;
}
.top{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.panel{
  font-size:18px;
  font-weight:700;
}
.hero{
  position:relative;
  text-align:center;
  margin:10px 0 6px;
  padding:26px 14px 20px;
  border-radius:24px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 40%, rgba(76,175,80,0.16), transparent 60%),
    linear-gradient(160deg, #ffffff 0%, #f2fff4 45%, #eaf7ff 100%);
  box-shadow:inset 0 0 0 1px rgba(76,175,80,0.12);
}
.hero::before,
.hero::after{
  content:"✨";
  position:absolute;
  font-size:22px;
  opacity:0.55;
  animation:sparkle 2.6s ease-in-out infinite;
  pointer-events:none;
}
.hero::before{ top:14px; left:18px; animation-delay:0s; }
.hero::after{ top:20px; right:20px; font-size:18px; animation-delay:1.1s; }
@keyframes sparkle{
  0%,100%{ transform:translateY(0) scale(1); opacity:0.35; }
  50%{ transform:translateY(-4px) scale(1.15); opacity:0.85; }
}
.click-action-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin:6px auto 4px;
  flex-wrap:wrap;
}
.autoclicker-counter{
  min-width:150px;
  padding:12px 14px;
  border-radius:14px;
  background:linear-gradient(135deg,#f8fafc,#eef2ff);
  border:1px solid #dbe3f0;
  box-shadow:0 4px 12px rgba(30,41,59,0.08);
  font-weight:800;
  color:#334155;
  text-align:center;
  white-space:nowrap;
}
.click-wrap{
  position:relative;
  width:150px;
  height:150px;
  margin:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
.click-wrap::before,
.click-wrap::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  border:2px solid rgba(67,160,71,0.45);
  animation:ringPulse 2.4s ease-out infinite;
}
.click-wrap::after{
  animation-delay:1.2s;
}
@keyframes ringPulse{
  0%{ transform:scale(0.92); opacity:0.8; }
  100%{ transform:scale(1.45); opacity:0; }
}
.click-emoji{
  position:absolute;
  font-size:20px;
  opacity:0.8;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,0.12));
}
.click-emoji.e1{ top:-6px; left:-4px; }
.click-emoji.e2{ bottom:-8px; right:-6px; }
.click-emoji.e3{ top:6px; right:-14px; }
.clickbtn{
  position:relative;
  z-index:1;
  width:150px;
  height:150px;
  border:none;
  border-radius:50%;
  font-size:28px;
  font-weight:800;
  color:white;
  cursor:pointer;
  background:linear-gradient(135deg,var(--green),var(--green2));
  box-shadow:0 10px 20px rgba(46,125,50,0.25), 0 0 0 6px rgba(255,255,255,0.6), 0 0 0 9px rgba(76,175,80,0.2);
  transition:transform 0.08s ease, box-shadow 0.15s ease;
}
.clickbtn:hover{
  box-shadow:0 12px 24px rgba(46,125,50,0.32), 0 0 0 6px rgba(255,255,255,0.7), 0 0 0 10px rgba(76,175,80,0.28);
}
.clickbtn:active{transform:scale(0.97)}
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}
.shopbtn, .worldbtn, .smallbtn, .gembtn, .devbtn, .unlockbtn{
  width:100%;
  padding:11px 12px;
  margin:4px 0;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  background:#f3f4f6;
}

#shop{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}
#shop .shopbtn{
  width:100%;
  margin:0;
  padding:8px 10px;
  border-radius:12px;
  line-height:1.3;
  text-align:left;
  display:flex;
  align-items:center;
  gap:10px;
  background:linear-gradient(135deg,#ffffff,#eef2ff);
  border:1px solid #e0e7ff;
  box-shadow:0 2px 6px rgba(30,41,59,0.06);
  transition:transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
}
#shop .shopbtn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 14px rgba(30,41,59,0.12);
  filter:none;
}
#shop .shopbtn:active{
  transform:translateY(0);
}
#shop .shopbtn.cant-afford{
  background:linear-gradient(135deg,#f9fafb,#f3f4f6);
  border-color:var(--line);
}
#shop .shop-icon{
  flex:0 0 auto;
  width:34px;
  height:34px;
  border-radius:9px;
  background:linear-gradient(135deg,var(--green),var(--green2));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  box-shadow:0 2px 5px rgba(46,125,50,0.25);
}
#shop .shopbtn.cant-afford .shop-icon{
  background:linear-gradient(135deg,#c7cdd6,#9aa3b1);
  box-shadow:none;
}
#shop .shop-info{
  flex:1 1 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
}
#shop .shop-label{
  font-size:13px;
  font-weight:700;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#shop .shop-meta{
  font-size:12px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  gap:6px;
}
#shop .shop-owned{
  font-weight:700;
  color:#4b5563;
}
@media (min-width:520px){
  #shop{grid-template-columns:1fr 1fr;}
}
@media (min-width:900px){
  #shop{grid-template-columns:1fr 1fr 1fr;}
}
 .shop-upgrade-row{display:flex;gap:6px;align-items:stretch;margin:4px 0;}
.shop-upgrade-row .shopbtn{flex:1;margin:0;}
.buy-max-btn{width:auto;min-width:78px;margin:0!important;padding:8px 7px!important;font-size:12px;}
.shopbtn:hover,.worldbtn:hover,.smallbtn:hover,.gembtn:hover,.devbtn:hover,.unlockbtn:hover{
  filter:brightness(0.98);
}
.shopbtn:disabled,.worldbtn:disabled,.smallbtn:disabled,.gembtn:disabled,.devbtn:disabled,.unlockbtn:disabled{
  opacity:0.55;
  cursor:not-allowed;
}
.progress-row{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}
.progress-label{
  flex:1 1 220px;
  min-width:200px;
}
.muted{color:var(--muted)}
.section-title{
  margin:0 0 10px;
}
.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:999px;
  background:#eef2ff;
  font-size:12px;
  margin-left:6px;
}
#eventMsg{
  min-height:48px;
  display:none;
  text-align:center;
  font-weight:700;
}
#ending1, #ending2{
  display:none;
  border-left:6px solid var(--accent);
}
#boostList{
  display:grid;
  gap:8px;
}
.boost-item{
  background:#f8fafc;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
}
.world-card{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px 12px;
  background:#fafafa;
}
.world-card.active{
  border-color:#60a5fa;
  background:#eff6ff;
}
.world-card.locked{
  opacity:0.75;
}
.world-card h4{
  margin:0 0 6px;
}
.world-card p{
  margin:4px 0;
}
.boost-details summary{
  cursor:pointer;
  font-weight:400;
  list-style:none;
}
.boost-details summary::-webkit-details-marker{
  display:none;
}
.boost-details summary::before{
  content:"▸ ";
  color:var(--muted);
}
.boost-details[open] summary::before{
  content:"▾ ";
}
.boost-breakdown{
  margin:6px 0 0 14px;
  padding-left:8px;
  border-left:2px solid var(--line);
}
.boost-breakdown p{
  margin:4px 0;
  font-size:14px;
  font-weight:400;
}
.world-teleport-row{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:6px;
  flex-wrap:wrap;
}
.world-teleport-input:focus{
  outline:2px solid #60a5fa;
}
.world-teleport-row .worldbtn{
  flex:0 0 auto;
  padding:10px 16px;
  min-width:110px;
}

@media (min-width:720px){
  .grid{grid-template-columns:1.2fr 0.9fr 0.7fr}
  .clickbtn{width:160px;height:160px;font-size:30px}
  .autoclicker-counter{min-width:140px;font-size:13px}
}

}
